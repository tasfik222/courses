<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 284" role="img">
<title>ALU এবং রেজিস্টারের মধ্যে তথ্য চলাচল</title>
<desc>রেজিস্টার A ও B থেকে ডাটা এবং অপারেশন কোড থেকে নির্দেশ নিয়ে ALU হিসাব করে ফলাফল রেজিস্টার C তে জমা করে</desc>
<defs>
<marker id="arrG2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="40" y="40" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="120" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">রেজিস্টার A</text>

<rect x="40" y="200" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="120" y="222" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">রেজিস্টার B</text>

