<text x="360" y="40" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">অপারেশন কোড</text>

<rect x="280" y="140" width="160" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="360" y="162" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">ALU</text>
<text x="360" y="186" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">গণনা সম্পাদন করে</text>

<rect x="520" y="150" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="590" y="170" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">রেজিস্টার C</text>
<text x="590" y="190" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">ফলাফল রাখে</text>

