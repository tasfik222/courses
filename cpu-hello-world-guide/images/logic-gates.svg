<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 234" role="img">
<title>চারটি মৌলিক লজিক গেট</title>
<desc>AND, OR, XOR এবং NOT গেটের নিয়ম</desc>

<rect x="40" y="40" width="280" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="180" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">AND গেট</text>
<text x="180" y="86" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">উভয় ১ হলে আউটপুট ১</text>

<rect x="360" y="40" width="280" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="500" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">OR গেট</text>
<text x="500" y="86" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">একটি ১ হলেই আউটপুট ১</text>

<rect x="40" y="130" width="280" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="180" y="152" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">XOR গেট</text>
<text x="180" y="176" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">ইনপুট ভিন্ন হলে আউটপুট ১</text>

<rect x="360" y="130" width="280" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="500" y="152" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">NOT গেট</text>
<text x="500" y="176" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">ইনপুট উল্টে দেয়</text>
</svg>
