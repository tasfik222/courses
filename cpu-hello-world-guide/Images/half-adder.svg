<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236" role="img">
<title>হাফ এডার সার্কিট</title>
<desc>ইনপুট A ও B একইসাথে XOR গেটে গিয়ে Sum এবং AND গেটে গিয়ে Carry তৈরি করে</desc>
<defs>
<marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="240" y="30" width="200" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="55" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">ইনপুট A ও B</text>

<line x1="340" y1="80" x2="210" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrG)"/>
<line x1="340" y1="80" x2="470" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrG)"/>

<rect x="100" y="140" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="210" y="160" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">XOR গেট</text>
<text x="210" y="180" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">ফলাফল: Sum</text>

<rect x="360" y="140" width="220" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="470" y="160" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">AND গেট</text>
<text x="470" y="180" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">ফলাফল: Carry</text>
</svg>
