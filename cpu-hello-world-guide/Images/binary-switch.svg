<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 256" role="img">
<title>বাইনারি অবস্থা: সুইচ অন হলে ১, অফ হলে ০</title>
<desc>ভোল্টেজ থাকলে কারেন্ট প্রবাহিত হয়ে আউটপুট ১ হয়, ভোল্টেজ না থাকলে আউটপুট ০ হয়</desc>
<defs>
<marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#3B6D11" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="40" y="40" width="190" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="135" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#27500A">ভোল্টেজ আছে (ON)</text>
<text x="135" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">সুইচ চালু</text>

<line x1="230" y1="68" x2="245" y2="68" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrGreen)"/>

<rect x="245" y="40" width="190" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#27500A">কারেন্ট প্রবাহিত</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">ইলেকট্রন চলাচল</text>

<line x1="435" y1="68" x2="450" y2="68" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrGreen)"/>

<rect x="450" y="40" width="190" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="545" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#27500A">আউটপুট = ১</text>
<text x="545" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">বাইনারি ১</text>

<rect x="40" y="160" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="135" y="178" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">ভোল্টেজ নেই (OFF)</text>
<text x="135" y="198" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">সুইচ বন্ধ</text>

<line x1="230" y1="188" x2="245" y2="188" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrGray)"/>

<rect x="245" y="160" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="178" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">কারেন্ট বন্ধ</text>
<text x="340" y="198" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">কোনো প্রবাহ নেই</text>

<line x1="435" y1="188" x2="450" y2="188" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrGray)"/>

<rect x="450" y="160" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="545" y="178" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">আউটপুট = ০</text>
<text x="545" y="198" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">বাইনারি ০</text>
</svg>
